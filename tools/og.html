<!doctype html>
<meta charset="utf-8">
<title>Aether social card</title>
<link rel="stylesheet" href="/aether.css">
<style>
  html,body{margin:0;background:var(--bg)}
  .card{position:relative;width:1200px;height:630px;padding:78px 78px 104px;box-sizing:border-box;
        display:flex;flex-direction:column;justify-content:flex-end;background:var(--bg)}
  .card .brand{position:absolute;top:70px;left:78px;display:flex;align-items:center;gap:16px}
  .card .brand .ae{font-size:46px}
  .card .brand .nm{font-family:var(--mono);font-size:19px;color:var(--ink)}
  .card h1{font-family:var(--display);font-size:86px;font-weight:800;line-height:1.02;
           letter-spacing:-.035em;margin:0 0 34px;color:var(--ink);max-width:640px}
  .card h1 .hl{color:var(--red)}
  .card .sub{font-family:var(--mono);font-size:22px;color:var(--dim);margin:0 0 52px}
  .card .cmd{font-family:var(--mono);font-size:22px;color:var(--ink);margin:0}
  .card .cmd .d{color:var(--red);margin-right:14px}
</style>
<div class="card">
  <span class="brand"><span class="ae">ae</span><span class="nm">aether</span></span>
  <h1><span class="hl">Actors</span> that compile to C.</h1>
  <p class="sub">native binaries &nbsp;&middot;&nbsp; no VM &nbsp;&middot;&nbsp; no garbage collector</p>
  <p class="cmd"><span class="d">$</span>curl -fsSL https://aether-lang.dev/install.sh | sh</p>
</div>
