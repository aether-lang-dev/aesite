<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Documentation — Aether Language</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="subpages.css">
  <style>
    .section {
      padding: 120px calc(max(2rem, (100% - 900px) / 2)) 80px;
    }
    footer {
      background: #eef1f4;
    }
    .doc-list {
      margin-top: 3rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
    .doc-card {
      display: block;
      padding: 1.25rem 1.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .doc-card:hover {
      border-color: var(--accent);
      background: #f7f9fb;
    }
    .doc-card-title {
      font-weight: 500;
    }
    @media (max-width: 768px) {
      .section { padding: 100px 1.5rem 60px; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a class="nav-logo" href="index.html">Aether<span>.</span></a>
    <ul class="nav-links">
      <li><a href="index.html#features">Features</a></li>
      <li><a href="index.html#syntax">Syntax</a></li>
      <li><a href="index.html#install">Install</a></li>
      <li><a href="faq.html">FAQ</a></li>
    </ul>
  </nav>

  <!-- DOCS SECTION -->
  <main class="section">
    <div class="fade-in">
      <p class="section-label">Documentation</p>
      <h1 class="subpage-title">Language <em>guide.</em></h1>
    </div>

    <div class="doc-list fade-in">
{{DOC_LINKS}}
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Nicolas Maman</p>
    <p><a href="#">Privacy</a> &middot; <a href="https://github.com/nicolasmd87/aether/blob/main/LICENSE">License</a> &middot; <a href="mailto:hello@aether.org">Contact</a></p>
  </footer>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("visible"); });
    }, { threshold: 0.1 });
    document.querySelectorAll(".fade-in").forEach(el => observer.observe(el));
  </script>
</body>
</html>
