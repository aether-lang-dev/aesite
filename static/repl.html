<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground · Aether</title>
<meta name="description" content="Write and run Aether in the browser. Three short lessons, executed on the Aether server.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/aether.css">
</head>
<body>
<header class="site-head">
  <div class="wrap bar">
    <a class="brand" href="/" aria-label="Aether"><span class="ae">ae</span><span class="nm">aether</span></a>
    <nav>
      <a href="/repl.html" class="on">Playground</a>
      <a href="/Docs/getting-started.html">Docs</a>
      <a href="https://github.com/aether-lang-org/aether">Source</a>
      <span class="vtag">v0.454</span>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="sec-head" style="padding-top:44px"><h2>Playground</h2><span class="rule"></span></div>
  <div class="repl">
    <div class="lessons" id="lessons"><div class="lh">Lessons</div></div>
    <div class="stage">
      <div class="theory"><h3 id="ttl">—</h3><div id="thy"></div></div>
      <div class="editwrap">
        <pre id="hl" aria-hidden="true"></pre>
        <textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Aether code editor"></textarea>
      </div>
      <div class="runbar">
        <button class="run" id="run">Run &rsaquo;</button>
        <span class="hint">runs on the Aether server via <code style="color:var(--dim)">ae run</code></span>
        <span class="lnav"><button id="prev">&larr; prev</button><button id="next">next &rarr;</button></span>
      </div>
      <div class="output" id="out"><span class="op">&gt;</span> <span class="muted">press Run</span></div>
    </div>
  </div>
</main>

<footer class="site-foot">
  <div class="wrap foot">
    <span class="ae">ae</span>
    <span class="m">MIT licensed · compiles to C · v0.454</span>
    <nav><a href="/Docs/getting-started.html">Docs</a><a href="/">Home</a><a href="https://github.com/aether-lang-org/aether">GitHub</a></nav>
  </div>
</footer>

<script>
(function(){
  "use strict";
  var KW=/\b(actor|message|state|receive|reply|spawn|main|return|for|in|if|else|match|let|const|import|struct|defer|when|and|or|true|false|none)\b/;
  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function hi(src){
    var out="",i=0,n=src.length;
    while(i<n){
      var c=src[i];
      if(c==="/"&&src[i+1]==="/"){var j=src.indexOf("\n",i);if(j<0)j=n;out+='<span class="com">'+esc(src.slice(i,j))+'</span>';i=j;continue;}
      if(c==='"'){var j=i+1;while(j<n&&src[j]!=='"'){if(src[j]==="\\")j++;j++;}j++;out+='<span class="str">'+esc(src.slice(i,j))+'</span>';i=j;continue;}
      if(/[0-9]/.test(c)&&!/[A-Za-z_]/.test(src[i-1]||"")){var j=i;while(j<n&&/[0-9._]/.test(src[j]))j++;out+='<span class="num">'+esc(src.slice(i,j))+'</span>';i=j;continue;}
      if(/[A-Za-z_]/.test(c)){var j=i;while(j<n&&/[A-Za-z0-9_]/.test(src[j]))j++;var w=src.slice(i,j);
        if(KW.test(w))out+='<span class="kw">'+w+'</span>';
        else if(src[j]==="(")out+='<span class="fn">'+w+'</span>';
        else out+=esc(w); i=j;continue;}
      if(c==="!"||c==="?"){out+='<span class="kw">'+c+'</span>';i++;continue;}
      if("{}()[]".indexOf(c)>=0){out+='<span class="pn">'+c+'</span>';i++;continue;}
      out+=esc(c);i++;
    }
    return out;
  }
  var titles=["Hello, Aether","Functions & loops","Actors"];
  var ed=document.getElementById("ed"),hlEl=document.getElementById("hl"),out=document.getElementById("out"),
      ttl=document.getElementById("ttl"),thy=document.getElementById("thy"),lessonsEl=document.getElementById("lessons"),
      runBtn=document.getElementById("run");
  var cur=1;
  function paint(){hlEl.innerHTML=hi(ed.value)+"\n";hlEl.scrollTop=ed.scrollTop;hlEl.scrollLeft=ed.scrollLeft;}
  function setActive(n){[].forEach.call(lessonsEl.querySelectorAll("button"),function(b){b.classList.toggle("on",+b.dataset.n===n);});}
  function load(n){
    cur=n;setActive(n);
    out.innerHTML='<span class="op">&gt;</span> <span class="muted">press Run</span>';
    fetch("/api/lesson/"+n).then(function(r){return r.json();}).then(function(d){
      ttl.textContent=d.title||titles[n-1]||("Lesson "+n);
      thy.innerHTML=d.theory||"";
      ed.value=(d.starter_code||"").replace(/\s+$/,"")+"\n";
      paint();
    }).catch(function(){ttl.textContent=titles[n-1]||("Lesson "+n);ed.value="";paint();});
  }
  function run(){
    runBtn.disabled=true;
    out.innerHTML='<span class="op">&gt;</span> <span class="muted">running…</span>';
    fetch("/api/exec",{method:"PUT",headers:{"Content-Type":"text/plain"},body:ed.value})
      .then(function(r){return r.json();})
      .then(function(d){
        var t=((d.stdout||"")+(d.stderr||"")).replace(/\s+$/,"");
        out.innerHTML=t? t.split("\n").map(function(l){return '<span class="op">&gt;</span> '+esc(l);}).join("\n")
                       : '<span class="op">&gt;</span> <span class="muted">(no output)</span>';
      })
      .catch(function(){out.innerHTML='<span class="op">&gt;</span> <span class="err">could not reach the server</span>';})
      .finally(function(){runBtn.disabled=false;});
  }
  titles.forEach(function(t,i){var b=document.createElement("button");b.dataset.n=i+1;
    b.innerHTML='<span class="idx">'+String(i+1).padStart(2,"0")+'</span>'+t;b.onclick=function(){load(i+1);};lessonsEl.appendChild(b);});
  ed.addEventListener("input",paint);
  ed.addEventListener("scroll",function(){hlEl.scrollTop=ed.scrollTop;hlEl.scrollLeft=ed.scrollLeft;});
  runBtn.onclick=run;
  document.getElementById("prev").onclick=function(){load(cur>1?cur-1:titles.length);};
  document.getElementById("next").onclick=function(){load(cur<titles.length?cur+1:1);};
  load(1);
})();
</script>
</body>
</html>
