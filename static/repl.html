<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive REPL — Aether Language</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Override body to be full-height with no global scroll */
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .lesson-nav {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .lesson-page {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.06em;
      min-width: 3.2rem;
      text-align: center;
    }

    .lesson-nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: transparent;
      color: var(--text);
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
    }

    .lesson-nav-btn:hover {
      background: var(--text);
      border-color: var(--text);
      color: var(--bg);
    }

    .lesson-nav-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .lesson-nav-btn:disabled:hover {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }

    /* ─── SPLIT LAYOUT ──────────────────────────────────────────── */
    .repl-layout {
      margin-top: 64px; /* below fixed nav */
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      min-height: 0;
    }

    /* ─── THEORY PANE ───────────────────────────────────────────── */
    .theory-pane {
      overflow-y: auto;
      padding: 2.5rem 2.5rem 2.5rem 2rem;
      border-right: 1px solid var(--border);
      background: var(--bg);
    }

    /* Custom scrollbar in theory pane */
    .theory-pane::-webkit-scrollbar {
      width: 5px;
    }
    .theory-pane::-webkit-scrollbar-track {
      background: transparent;
    }
    .theory-pane::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 99px;
    }
    .theory-pane::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    .theory-section-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.55rem;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--text);
      margin-bottom: 1.4rem;
    }

    h2::after {
      content: '';
      display: block;
      width: 1.5rem;
      height: 2px;
      background: var(--accent);
      margin-top: 0.7rem;
      border-radius: 1px;
    }

    .theory-body {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.8;
    }

    .theory-body p {
      margin-bottom: 1.1rem;
    }

    .theory-body p:last-child {
      margin-bottom: 0;
    }

    .theory-body strong {
      color: var(--text);
      font-weight: 500;
    }

    .theory-body em {
      font-style: italic;
      color: var(--text);
    }

    h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-top: 1.8rem;
      margin-bottom: 0.6rem;
    }

    code {
      display: block;
      background: #ffffff;
      border: 1px solid var(--border);
      color: #24292e;
      font-family: 'DM Mono', monospace;
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.75;
      padding: 1rem 1.25rem;
      border-radius: 6px;
      margin: 1rem 0 1.4rem;
      overflow-x: auto;
      white-space: pre;
    }

    code .kw  { color: #c0292b; }
    code .fn  { color: #6a35b8; }
    code .str { color: #1a7a3c; }
    code .num { color: #0070a8; }
    code .cm  { color: #7a8390; }

    .theory-note {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      border-radius: 0 4px 4px 0;
      padding: 0.85rem 1rem;
      margin: 1.4rem 0;
      font-size: 0.83rem;
      color: var(--text);
      line-height: 1.65;
    }

    .theory-note-icon {
      font-size: 0.8rem;
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 0.1rem;
    }

    /* ─── REPL PANE ─────────────────────────────────────────────── */
    .repl-pane {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      overflow: hidden;
    }

    .repl-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      height: 44px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .repl-toolbar-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .repl-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    .repl-dot-red    { background: #d9534f; }
    .repl-dot-yellow { background: #e8a838; }
    .repl-dot-green  { background: #5cb85c; }

    .repl-toolbar-title {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.05em;
      margin-left: 0.6rem;
    }

    .repl-run-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.35rem 0.9rem;
      background: var(--accent);
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      opacity: 1;
    }

    .repl-run-icon {
      font-size: 0.6rem;
    }

    .repl-editor {
      flex: 1;
      padding: 1.5rem 1.25rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.75;
      color: #24292e;
      background: #ffffff;
      overflow-y: auto;
      resize: none;
      border: none;
      outline: none;
      box-sizing: border-box;
      width: 100%;
    }

    .repl-placeholder-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.6;
      margin-bottom: 1.2rem;
    }

    .repl-placeholder-line {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.35rem;
    }

    .repl-line-num {
      font-size: 0.75rem;
      color: #c0c8d0;
      min-width: 1.5rem;
      text-align: right;
      user-select: none;
    }

    .repl-line-text {
      color: #24292e;
      font-size: 0.875rem;
    }

    .repl-line-text .kw  { color: #c0292b; }
    .repl-line-text .fn  { color: #6a35b8; }
    .repl-line-text .str { color: #1a7a3c; }
    .repl-line-text .num { color: #0070a8; }
    .repl-line-text .cm  { color: #7a8390; }

    .repl-cursor {
      display: inline-block;
      width: 2px;
      height: 0.95em;
      background: #c8522a;
      opacity: 0;
      vertical-align: text-bottom;
      margin-left: 1px;
      border-radius: 1px;
    }

    .repl-output {
      flex-shrink: 0;
      height: 120px;
      min-height: 48px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      padding: 0 1.25rem 0.75rem;
      overflow-y: auto;
    }

    .repl-resize-handle {
      height: 10px;
      cursor: ns-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 -1.25rem 0.5rem;
      flex-shrink: 0;
    }

    .repl-resize-handle::after {
      content: '';
      width: 2.5rem;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      transition: background 0.15s;
    }

    .repl-resize-handle:hover::after {
      background: var(--muted);
    }

    .repl-output-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.6;
      margin-bottom: 0.5rem;
    }

    .repl-output-text {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.7;
    }

    .repl-output-prompt {
      color: var(--border);
      margin-right: 0.4rem;
    }

    /* ─── RESPONSIVE ────────────────────────────────────────────── */
    @media (max-width: 840px) {
      .repl-layout {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
      .theory-pane {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a class="nav-logo" href="index.html">Aether<span>.</span></a>
    <div class="lesson-nav" style="margin-left: auto;">
      <button class="lesson-nav-btn" id="btn-prev" title="Previous lesson">&#8592;</button>
      <span class="lesson-page" id="page-indicator">12 / 25</span>
      <button class="lesson-nav-btn" id="btn-next" title="Next lesson">&#8594;</button>
    </div>
  </nav>

  <!-- SPLIT LAYOUT -->
  <div class="repl-layout">

    <!-- LEFT: THEORY PANE -->
    <div class="theory-pane">
      <p class="theory-section-label">Theory</p>
      <h2 id="lesson-title">Variables &amp; <em>Type Inference</em></h2>

      <div class="theory-body">

      </div>
    </div>

    <!-- RIGHT: REPL PANE -->
    <div class="repl-pane">

      <!-- Toolbar -->
      <div class="repl-toolbar">
        <div class="repl-toolbar-left">
          <span class="repl-dot repl-dot-red"></span>
          <span class="repl-dot repl-dot-yellow"></span>
          <span class="repl-dot repl-dot-green"></span>
          <span class="repl-toolbar-title">main.aether — REPL</span>
        </div>
        <button class="repl-run-btn" id="btn-run" title="Run code">
          <span class="repl-run-icon">&#9654;</span> Run
        </button>
      </div>

      <!-- Editor area -->
      <textarea class="repl-editor" id="repl-editor-input" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="// Write your Aether code here"></textarea>

      <!-- Output area -->
      <div class="repl-output" id="repl-output">
        <div class="repl-resize-handle" id="repl-resize-handle"></div>
        <div class="repl-output-label">Output</div>
        <div class="repl-output-text" id="repl-output-text">
          <span class="repl-output-prompt">&gt;</span> Press Run to execute your code.
        </div>
      </div>

    </div>
  </div><!-- /.repl-layout -->

  <script>
    /* ── Resize output pane ───────────────────────────────────── */
    const replOutput    = document.getElementById('repl-output');
    const resizeHandle  = document.getElementById('repl-resize-handle');

    resizeHandle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const startY      = e.clientY;
      const startHeight = replOutput.offsetHeight;
      const maxHeight   = replOutput.parentElement.offsetHeight - 44 - 48;

      function onMove(e) {
        const newHeight = Math.min(maxHeight, Math.max(48, startHeight + (startY - e.clientY)));
        replOutput.style.height = newHeight + 'px';
      }
      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    /* ── Lesson loader ─────────────────────────────────────────── */
    const TOTAL_PAGES = 25;
    let currentPage = 1;

    const indicator  = document.getElementById('page-indicator');
    const btnPrev    = document.getElementById('btn-prev');
    const btnNext    = document.getElementById('btn-next');
    const theoryBody   = document.querySelector('.theory-body');
    const lessonTitle  = document.getElementById('lesson-title');
    const replEditor   = document.getElementById('repl-editor-input');
    const btnRun       = document.getElementById('btn-run');
    const outputText   = document.getElementById('repl-output-text');

    function getEditorCode() {
      return replEditor.value;
    }

    function showOutput(stdout, stderr) {
      let html = '';
      if (stdout && stdout.trim()) {
        stdout.split('\n').forEach(line => {
          html += `<div><span class="repl-output-prompt">&gt;</span> ${line}</div>`;
        });
      }
      if (stderr && stderr.trim()) {
        stderr.split('\n').forEach(line => {
          html += `<div style="color:#c0292b"><span class="repl-output-prompt">&gt;</span> ${line}</div>`;
        });
      }
      outputText.innerHTML = html || '<span class="repl-output-prompt">&gt;</span> (no output)';
    }

    btnRun.addEventListener('click', async () => {
      btnRun.disabled = true;
      outputText.innerHTML = '<span class="repl-output-prompt">&gt;</span> Running…';
      try {
        const res = await fetch('/api/exec', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_code: getEditorCode() }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        showOutput(data.stdout, data.stderr);
      } catch (err) {
        outputText.innerHTML = `<span style="color:#c0292b">&gt; Error: ${err.message}</span>`;
      } finally {
        btnRun.disabled = false;
      }
    });

    function renderCode(code) {
      replEditor.value = code;
    }

    async function loadLesson(nbr) {
      try {
        const res = await fetch('/api/lesson/' + nbr);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        theoryBody.innerHTML = data.theory;
        lessonTitle.textContent = data.title;
        renderCode(data.starter_code);
      } catch (err) {
        theoryBody.innerHTML = '<p style="color:var(--accent)">Lesson failed to load: ' + err.message + '</p>';
      }
    }

    function updateNav() {
      indicator.textContent = currentPage + ' / ' + TOTAL_PAGES;
      btnPrev.disabled = currentPage <= 1;
      btnNext.disabled = currentPage >= TOTAL_PAGES;
    }

    btnPrev.addEventListener('click', () => {
      if (currentPage > 1) { currentPage--; updateNav(); loadLesson(currentPage); }
    });

    btnNext.addEventListener('click', () => {
      if (currentPage < TOTAL_PAGES) { currentPage++; updateNav(); loadLesson(currentPage); }
    });

    updateNav();
    loadLesson(currentPage);


  </script>
</body>
</html>
