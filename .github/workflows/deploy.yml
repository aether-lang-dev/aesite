name: aesite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release sync commits the regenerated site with GITHUB_TOKEN, and a
  # push made with that token deliberately does not start a workflow. So the
  # sync asks for this one explicitly, which it can only do if this trigger
  # exists: without it the call is a 422 and the regenerated site is committed
  # and never published.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # CI: build the Aether server and run the integration test. Gates deploy.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the libraries the released toolchain links against
        run: |
          # `ae build` appends these to EVERY link, whether or not the program
          # imports the module that needs them: a hello-world links -lssl
          # -lcrypto -lz -lnghttp2 -lpcre2-8 -lbrotlienc -lbrotlicommon -lzstd.
          # The flags are baked into the released binary from whatever the
          # release runner happened to have, so a consumer needs the same set
          # present or nothing links at all.
          #
          # That is what stalled this site. Every deploy since 2026-09-08
          # failed at `ld: cannot find -lbrotlienc`, while `sync aether
          # release` kept succeeding -- so main regenerated for each new
          # aether version and the published page never moved. Filed upstream
          # as aether-lang-dev/aether#1988; this list can shrink when the
          # toolchain stops linking what a program does not use.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev zlib1g-dev libnghttp2-dev libpcre2-dev \
            libbrotli-dev libzstd-dev
      - name: Install Aether toolchain
        env:
          # Pin, so this pipeline's colour depends on a change here rather than
          # on whatever aether released most recently. Unpinned, get.sh takes
          # "the latest vX.Y.Z tag": a bad upstream release turns this red with
          # no commit in this repo, which is exactly how aether-ui#28 went red
          # on a codegen regression it had nothing to do with.
          #
          # The pin lives in aether-version.txt rather than here, because the
          # release sync updates it and GITHUB_TOKEN may never push a change to
          # a workflow file. It could regenerate the whole site and then not
          # commit it, which is how the site sat thirty releases behind.
          #
          # A repository variable still overrides, for a one-off.
          AETHER_REF_DEFAULT_FILE: aether-version.txt
          AETHER_REF_OVERRIDE: ${{ vars.AETHER_REF }}
        run: |
          AETHER_REF="${AETHER_REF_OVERRIDE:-$(tr -d '[:space:]' < "$AETHER_REF_DEFAULT_FILE")}"
          case "$AETHER_REF" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$AETHER_REF_DEFAULT_FILE does not hold a vX.Y.Z tag: '$AETHER_REF'"; exit 1 ;;
          esac
          echo "pinned to $AETHER_REF"
          curl -sSL https://raw.githubusercontent.com/aether-lang-dev/aether/main/get.sh \
            | PREFIX="$HOME/.local" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ae --version
      - name: Build serve.ae and run integration test
        run: ./test.sh

  # CD: publish the static site to GitHub Pages at aether-lang.dev.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - id: deploy
        uses: actions/deploy-pages@v4
