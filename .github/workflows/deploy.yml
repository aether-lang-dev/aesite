name: aesite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # CI: build the Aether server and run the integration test. Gates deploy.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Aether toolchain
        run: |
          curl -sSL https://raw.githubusercontent.com/aether-lang-dev/aether/main/get.sh \
            | PREFIX="$HOME/.local" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build serve.ae and run integration test
        run: ./test.sh

  # CD: publish the static site to GitHub Pages at aether-lang.dev.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - id: deploy
        uses: actions/deploy-pages@v4
