<p>Aether compiles to C, so it calls C directly. <code>extern</code> declares a
C function; libc is always linked, so no extra setup is needed here.</p>
<p>This is how Aether reaches any C library: declare the signature, call it like
a normal function. See <a href="/Docs/c-interop.html">C Interoperability</a>.</p>
