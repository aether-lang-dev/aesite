<p>Every Aether program starts at <strong>main()</strong>. <code>println</code>
writes a line to standard output.</p>
<p>String interpolation uses <code>${...}</code>, so <code>println("n = ${n}")</code>
prints the value of <code>n</code>. Press <strong>Run</strong> to compile and execute this on the Aether server.</p>
